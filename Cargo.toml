[package]
name = "renderama"
version = "0.36.2"
authors = ["mandeep <mandeep@users.noreply.github.com>"]
edition = "2015"
build = "build.rs"
description = "A simple path tracer written in Rust"

[features]
denoise = ["oidn"]
tests = []

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
glam = "0.32.1"
image = { version = "0.25.10", features = ["exr"] }
oidn = { version = "2.3.3", optional = true }
pbr = "1.0.2"
rand = "0.10.1"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
rayon = "1.12.0"
wide = "1.3.0"
tobj = "4.0.3"


[profile.dev]
opt-level = 3
debug = true