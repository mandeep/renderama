[package]
name = "renderama"
version = "0.34.0"
authors = ["mandeep <mandeep@users.noreply.github.com>"]
edition = "2015"
build = "build.rs"

[features]
denoise = ["oidn"]

[dependencies]
chrono = "0.4.44"
glam = "0.32.1"
image = { version = "0.25.10", features = ["exr"] }
oidn = { version = "2.3.3", optional = true }
pbr = "1.0.2"
rand = "0.10.1"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
rayon = "1.12.0"
wide = "1.3.0"
tobj = "4.0.3"

[profile.dev]
opt-level = 3
debug = true